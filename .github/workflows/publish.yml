name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Build to succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAX_WAIT=1200
          WAIT_STEP=30
          elapsed=0
          while [ $elapsed -lt $MAX_WAIT ]; do
            STATUS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=build.yml --commit "$GITHUB_SHA" --json conclusion --jq '.[0].conclusion // empty')
            if [ "$STATUS" = "success" ]; then
              echo "Build succeeded"
              break
            elif [ "$STATUS" = "failure" ] || [ "$STATUS" = "cancelled" ]; then
              echo "Build failed with status: $STATUS"
              exit 1
            fi
            echo "Waiting for Build... (${elapsed}s elapsed)"
            sleep $WAIT_STEP
            elapsed=$((elapsed + WAIT_STEP))
          done
          if [ "$STATUS" != "success" ]; then
            echo "Timed out waiting for Build to succeed"
            exit 1
          fi

      - name: Wait for Test to succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAX_WAIT=1200
          WAIT_STEP=30
          elapsed=0
          while [ $elapsed -lt $MAX_WAIT ]; do
            STATUS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=test.yml --commit "$GITHUB_SHA" --json conclusion --jq '.[0].conclusion // empty')
            if [ "$STATUS" = "success" ]; then
              echo "Test succeeded"
              break
            elif [ "$STATUS" = "failure" ] || [ "$STATUS" = "cancelled" ]; then
              echo "Test failed with status: $STATUS"
              exit 1
            fi
            echo "Waiting for Test... (${elapsed}s elapsed)"
            sleep $WAIT_STEP
            elapsed=$((elapsed + WAIT_STEP))
          done
          if [ "$STATUS" != "success" ]; then
            echo "Timed out waiting for Test to succeed"
            exit 1
          fi

      - name: Verify tag version matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Version mismatch: tag=$TAG_VERSION package.json=$PKG_VERSION"
            exit 1
          fi
          echo "Version confirmed: $TAG_VERSION"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get build run ID for tagged commit
        id: build-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=build.yml --commit "$GITHUB_SHA" --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' | head -1)
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: plexis-dist
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.build-run.outputs.run-id }}

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks --provenance
