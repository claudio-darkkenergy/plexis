name: Build, Test, and Publish

on:
  pull_request:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: plexis-dist
          path: packages/plexis/dist/

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: plexis-dist
          path: packages/plexis/dist/

      - name: Test
        run: pnpm test

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: plexis-dist
          path: packages/plexis/dist/

      - name: Verify tag version matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./packages/plexis/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Version mismatch: tag=$TAG_VERSION package.json=$PKG_VERSION"
            exit 1
          fi
          echo "Version confirmed: $TAG_VERSION"

      - name: Publish to npm
        working-directory: packages/plexis
        run: |
          # Capture output so a silent OIDC fallback can be turned into a loud,
          # actionable failure instead of a misleading "E404 Not Found".
          # GitHub's default shell runs with `set -eo pipefail`; disable errexit
          # around the publish so the guard below always runs.
          publish_log="$(mktemp)"
          set +e
          pnpm publish --access public --no-git-checks --provenance 2>&1 | tee "$publish_log"
          status=${PIPESTATUS[0]}
          set -e

          # Narrowly scoped to OIDC token-exchange signals so transient registry
          # 5xx errors still surface as themselves via `exit $status` below.
          if grep -qE 'Skipped OIDC|ERR_PNPM_AUTH_TOKEN_EXCHANGE' "$publish_log"; then
            echo "::error title=npm OIDC token exchange failed::Trusted publishing did not authenticate; npm rejected the GitHub OIDC token, so this publish was NOT authenticated."
            echo "Remediation: confirm the npm trusted-publisher record for @tde.io/plexis names this workflow file (build.yml) and any required environment at https://www.npmjs.com/package/@tde.io/plexis/access"
            exit 1
          fi

          exit "$status"
